<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Product Explorer & Analytics Dashboard</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 20px auto; padding: 0 15px; }
    .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .controls input, .controls select { padding: 6px 10px; }
    #statistics { display: flex; gap: 20px; background: #f4f4f4; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; flex-wrap: wrap; }
    #status-message { color: #b00; margin-bottom: 10px; }
    #product-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    .product-card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
    .product-card img { width: 100%; height: 120px; object-fit: contain; }
    .product-card .category { color: #888; font-size: 0.85em; }
    .fav-btn { width: 100%; padding: 6px; margin-top: 8px; cursor: pointer; }
    .empty-message { grid-column: 1 / -1; text-align: center; color: #888; }
  </style>
</head>
<body>

  <h1>Product Explorer & Analytics Dashboard</h1>

  <div id="statistics"></div>
  <div id="status-message"></div>

  <div class="controls">
    <input type="text" id="search-input" placeholder="Cari produk...">
    <select id="category-select">
      <option value="all">Semua Kategori</option>
    </select>
    <select id="sort-select">
      <option value="default">Urutkan...</option>
      <option value="price-asc">Harga: Rendah ke Tinggi</option>
      <option value="price-desc">Harga: Tinggi ke Rendah</option>
      <option value="rating">Rating Tertinggi</option>
      <option value="title">Nama (A-Z)</option>
    </select>
  </div>

  <div id="product-list"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
